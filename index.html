<style>
:root{--ink:#0f172a;--mut:#64748b;--line:#e2e8f0;--soft:#f8fafc;--acc:#E50914;--mono:'IBM Plex Mono',ui-monospace,monospace;--sans:'IBM Plex Sans',system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#fff;color:var(--ink);font-family:var(--sans);overflow:hidden}
#stage{position:fixed;inset:0}#stage canvas{display:block}
#labels{position:fixed;inset:0;pointer-events:none}
header{position:fixed;top:0;left:0;right:0;height:58px;display:flex;align-items:center;gap:18px;padding:0 18px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.9);backdrop-filter:blur(8px);z-index:6}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand .tag{font:600 11px var(--mono);letter-spacing:.08em;background:var(--ink);color:#fff;padding:5px 8px;border-radius:4px;white-space:nowrap}
.brand h1{font:600 15px var(--sans);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{display:block;font:400 11px var(--mono);color:var(--mut);white-space:nowrap}
.stats{margin-left:auto;display:flex;gap:20px}
.stat{text-align:right}.stat b{display:block;font:600 19px var(--mono);line-height:1}.stat span{font:500 9px var(--mono);letter-spacing:.1em;color:var(--mut);text-transform:uppercase}
#crumbs{position:fixed;top:66px;left:50%;transform:translateX(-50%);z-index:6;display:none;align-items:center;gap:4px;background:#0f172a;color:#fff;border-radius:999px;padding:5px 6px 5px 10px;box-shadow:0 6px 20px rgba(15,23,42,.18);max-width:calc(100% - 560px);overflow:hidden}
#crumbs.on{display:flex}
#crumbs button{background:none;border:0;color:#cbd5e1;font:500 12px var(--mono);cursor:pointer;padding:3px 6px;border-radius:999px;white-space:nowrap;max-width:220px;overflow:hidden;text-overflow:ellipsis}
#crumbs button:hover{color:#fff}#crumbs button.cur{color:#fff;font-weight:600}
#crumbs span{color:#64748b}
#crumbs .out{background:#fff;color:#0f172a;margin-left:8px;padding:3px 10px}
.panel{position:fixed;background:rgba(255,255,255,.95);border:1px solid var(--line);border-radius:10px;box-shadow:0 6px 24px rgba(15,23,42,.06);z-index:4}
.ph{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-bottom:1px solid var(--line);font:600 10.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--mut);position:sticky;top:0;background:#fff;z-index:2}
#legend{top:72px;left:14px;width:244px;max-height:calc(100% - 150px);overflow:auto}
.lg{padding:8px 12px 10px;border-bottom:1px dashed var(--line)}.lg:last-child{border-bottom:0}
.lg h4{font:600 10px var(--mono);letter-spacing:.08em;color:var(--mut);margin:2px 0 6px;text-transform:uppercase}
.row{display:flex;align-items:center;gap:8px;padding:3px 0;font-size:12.5px;cursor:pointer;user-select:none}
.row input{accent-color:var(--ink)}.row .dot{width:10px;height:10px;border-radius:50%;flex:none}
.row .sh{width:12px;height:12px;flex:none;display:grid;place-items:center;font-size:11px}
.row em{margin-left:auto;font:500 11px var(--mono);color:var(--mut);font-style:normal}
.mini{border:1px solid var(--line);background:#fff;border-radius:4px;font-size:11px;padding:0 4px;cursor:pointer;color:var(--mut)}.mini:hover{color:var(--ink);border-color:#94a3b8}
.lnk{display:flex;align-items:center;gap:8px;font-size:12px;padding:3px 0}
.lnk i{display:inline-block;width:26px;height:0;border-top:2px solid #475569}.lnk i.d{border-top:2px dashed #94a3b8}.lnk i.p{border-top:2px solid var(--acc)}
#search{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:6px;font:400 12.5px var(--sans);background:#fff}
#search:focus{outline:2px solid #0f172a22;border-color:#94a3b8}
.seg{display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg button,.btn{font:500 12px var(--mono);border:0;background:#fff;padding:7px 10px;cursor:pointer;color:var(--ink);white-space:nowrap}
.seg button+button{border-left:1px solid var(--line)}.seg button.on{background:var(--ink);color:#fff}
#lvl{width:100%}#lvl button{flex:1;padding:5px 2px;font-size:10.5px}
.btn{border:1px solid var(--line);border-radius:7px}.btn:hover,.seg button:not(.on):hover{background:var(--soft)}
.btn.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.star{background:#E50914;color:#fff;border-color:#E50914;font-weight:600}.btn.star.on{background:#9b0610;border-color:#9b0610}
/* detalle */
#detail{top:72px;right:14px;width:380px;max-height:calc(100% - 150px);overflow:auto;display:none}#detail.on{display:block}
.dt{padding:14px 16px 18px}
.kick{font:600 10.5px var(--mono);letter-spacing:.06em;text-transform:uppercase;margin:-2px 0 8px}
.dt h2{font:700 20px/1.25 var(--sans);margin:2px 0 8px}
.dt p{font-size:13.5px;line-height:1.55;color:#334155}
.dt p.ctx{margin-top:8px;background:var(--soft);border-radius:6px;padding:8px 10px;font-size:13px}
.dt p.obj{font-size:14px;color:#0f172a}
.path{font:500 11px var(--mono);color:var(--mut);margin-bottom:6px}.path a{cursor:pointer;color:var(--mut)}.path a:hover{color:var(--ink);text-decoration:underline}
blockquote{margin:12px 0 4px;padding:10px 12px;border-left:3px solid;background:#fafafa;border-radius:0 6px 6px 0;font:italic 500 14.5px/1.45 var(--sans);color:#0f172a}
blockquote small{display:block;font:500 9.5px var(--mono);font-style:normal;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin-top:6px}
.sec{margin-top:14px}
.sec h5{font:600 10px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin-bottom:6px}
.dt ul{list-style:none;font-size:13px;line-height:1.45;color:#1e293b}
.dt li{position:relative;padding:3px 0 3px 20px}
.dt li::before{position:absolute;left:2px;top:3px;font-size:12px}
.li-i li::before{content:'•';color:#64748b;font-size:15px;top:1px}
.li-r li::before{content:'✓';color:#2E9E5B;font-weight:700}
.li-x li::before{content:'⚠';color:#D97706}
.li-q li::before{content:'?';color:#2B6CB0;font-weight:700;font-family:var(--mono)}
.acts{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.act{font:600 12px var(--mono);border:1px solid var(--line);background:#fff;border-radius:7px;padding:7px 10px;cursor:pointer;color:var(--ink)}
.act:hover{background:var(--soft)}.act.pri{background:var(--ink);color:#fff;border-color:var(--ink)}.act:disabled{opacity:.35;cursor:default}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}
.chip{font:500 11px var(--mono);border:1px solid var(--line);border-radius:999px;padding:3px 8px;background:#fff;cursor:pointer;color:var(--ink)}
.chip:hover{border-color:#94a3b8}.chip.g{border-color:#fecaca;color:#b91c1c;background:#fff5f5}.chip.static{cursor:default}
.cn{display:flex;gap:8px;align-items:flex-start;padding:6px 8px;border-radius:6px;cursor:pointer;font-size:12.5px;line-height:1.35}
.cn:hover{background:var(--soft)}.cn .dot{width:9px;height:9px;border-radius:50%;margin-top:4px;flex:none}
.cn small{display:block;color:var(--mut);font-size:11.5px;margin-top:1px}
.cn .cnt{font:600 10px var(--mono);color:var(--mut);font-style:normal}
.cn.rec{border:1px solid var(--line);margin-bottom:5px}.cn.rec small{color:#334155;font-size:12px}
.ev{font:600 9px var(--mono);padding:1px 5px;border-radius:3px;margin-left:5px;vertical-align:1px}
.ev.doc{background:#0f172a;color:#fff}.ev.conc{background:#e2e8f0;color:#334155}
.ref{display:block;font-size:12px;line-height:1.4;padding:5px 0;color:#1d4ed8;text-decoration:none;border-bottom:1px dotted var(--line)}
.ref:hover{text-decoration:underline}.ref.nolink{color:#334155}
.x{border:0;background:none;font-size:18px;cursor:pointer;color:var(--mut);line-height:1}
.back{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:#fff5f5;color:#b91c1c;font:600 11.5px var(--mono);padding:8px 14px;cursor:pointer}
.steps{display:flex;gap:4px;padding:10px 14px 0;flex-wrap:wrap}
.steps button{width:28px;height:28px;border-radius:50%;border:1px solid var(--line);background:#fff;font:600 11px var(--mono);cursor:pointer}
.steps button.on{background:#E50914;border-color:#E50914;color:#fff}
.gnav{display:flex;justify-content:space-between;margin-top:18px}
.hop{margin:0 0 0 12px;padding:2px 0 2px 14px;border-left:2px solid #E50914;font:500 11px var(--mono);color:#64748b}.hop a{color:#1d4ed8}
/* barra */
#bar{left:0;right:0;margin:0 auto;width:max-content;max-width:calc(100% - 28px);bottom:14px;display:flex;align-items:center;gap:8px;padding:8px 10px;flex-wrap:wrap;justify-content:center}
select{font:400 12px var(--sans);padding:6px;border:1px solid var(--line);border-radius:6px;max-width:150px;background:#fff}
.sep{width:1px;height:24px;background:var(--line)}
.lab{font:600 10px var(--mono);letter-spacing:.08em;color:var(--mut);text-transform:uppercase}
/* etiquetas */
.lbl{pointer-events:none;transition:opacity .2s;padding-bottom:7px}
.lbl>span{display:inline-block;font:500 11px var(--sans);color:#1e293b;white-space:nowrap;text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 6px #fff}
.lbl.autor{padding-bottom:22px}.lbl.precursor{padding-bottom:14px}.lbl.eje{padding-bottom:13px}.lbl.caso{padding-bottom:10px}.lbl.obra{padding-bottom:10px}.lbl.elemento{padding-bottom:4px}
.lbl.autor>span{font:700 13px var(--mono);padding:3px 8px;border-radius:5px;color:#fff;text-shadow:none;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.lbl.eje>span{font:600 10.5px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:#111;background:#fff;border:1px solid #111;padding:2px 6px;border-radius:3px;text-shadow:none}
.lbl.caso>span{font:600 10.5px var(--mono);color:#fff;padding:2px 6px;border-radius:3px;text-shadow:none}
.lbl.obra>span{font-style:italic;font-weight:600;color:#334155}
.lbl.precursor>span{font:600 11px var(--mono);color:#475569}
.lbl.elemento>span{font-size:10.5px;color:#475569}
.lbl.dim{opacity:.15}.lbl.hot>span{font-weight:700}.lbl.ext>span{opacity:.7;font-style:italic}
#tip{position:fixed;pointer-events:none;background:#0f172a;color:#fff;font:500 12px var(--sans);padding:6px 9px;border-radius:6px;z-index:9;display:none;max-width:300px;line-height:1.35}
#tip small{display:block;color:#cbd5e1;font:400 11px var(--mono)}#tip em{display:block;color:#fca5a5;font:500 10.5px var(--mono);font-style:normal;margin-top:3px}
#modal{position:fixed;inset:0;background:rgba(15,23,42,.25);display:none;place-items:center;z-index:20}#modal.on{display:grid}
#modal .box{background:#fff;border-radius:12px;width:min(760px,94vw);max-height:84vh;overflow:auto;padding:22px 24px;box-shadow:0 20px 60px rgba(0,0,0,.2)}
#modal h3{font:700 18px var(--sans);margin-bottom:4px}.mnote{font-size:13px;color:#64748b;margin-bottom:10px;line-height:1.5}
#modal .ri{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px;line-height:1.45}
#modal .ri a{color:#1d4ed8;text-decoration:none}
#modal .ri b{font:600 11px var(--mono);color:var(--mut);min-width:26px}#modal .ri small{display:block;color:var(--mut);font-size:11.5px}
.help h4{font:600 12px var(--mono);letter-spacing:.06em;text-transform:uppercase;margin:14px 0 6px;color:#334155}
.help li{font-size:13.5px;line-height:1.5;margin:3px 0 3px 18px}
#legendToggle{display:none}
@media (max-width:1250px){.stats .stat:nth-child(n+5){display:none}}
@media (max-width:900px){
 .stats{display:none}#legend{display:none;width:calc(100% - 28px)}#legend.on{display:block}#legendToggle{display:inline-block}
 #detail{left:14px;right:14px;width:auto;top:auto;bottom:130px;max-height:48%}
 #bar{width:auto;left:14px;right:14px}#crumbs{max-width:calc(100% - 28px)}
}
</style>

<body>
<div id="stage"></div><div id="labels"></div>
<header>
 <div class="brand"><span class="tag">PERFIL SW · RED</span>
  <div><h1>Guía en red de proyectos de software</h1><small>PMBOK 8 · Pressman · Sommerville · Boehm · McConnell · Cohn</small></div></div>
 <div class="stats" id="stats"></div>
</header>
<nav id="crumbs"></nav>
<aside class="panel" id="legend">
 <div class="ph">Mapa · filtros <span id="nvis"></span></div>
 <div class="lg"><input id="search" list="nodelist" placeholder="Buscar en 400+ nodos…"><datalist id="nodelist"></datalist></div>
 <div class="lg"><h4>Nivel de detalle</h4><div class="seg" id="lvl"><button data-l="1">1 Obras</button><button data-l="2" class="on">2 Conceptos</button><button data-l="3">3 Todo</button></div></div>
 <div class="lg"><h4>Autores <span style="font-weight:400;text-transform:none;letter-spacing:0">· ◎ = entrar</span></h4><div id="lgAut"></div></div>
 <div class="lg"><h4>Tipos de nodo</h4><div id="lgType"></div></div>
 <div class="lg"><h4>Enlaces</h4>
  <label class="row"><input type="checkbox" id="fDoc" checked><span class="lnk"><i></i>Documentado (fuente)</span></label>
  <label class="row"><input type="checkbox" id="fConc" checked><span class="lnk"><i class="d"></i>Conceptual (interpretación)</span></label>
  <label class="row"><input type="checkbox" id="fEje"><span class="lnk"><i style="border-color:#cbd5e1"></i>Concepto → eje</span></label>
  <div class="lnk" style="margin-top:4px"><i class="p"></i><span>Partículas = influencia entre autores</span></div>
 </div>
 <div class="lg"><h4>Etiquetas</h4><label class="row"><input type="checkbox" id="fLbl"> Mostrar todas</label></div>
</aside>
<aside class="panel" id="detail"></aside>
<div class="panel" id="bar">
 <button class="btn" id="legendToggle">☰</button>
 <button class="btn star" id="bGuide">★ Guía del proyecto</button>
 <div class="seg" id="modes"><button data-m="red" class="on">Red</button><button data-m="infl">Influencias</button><button data-m="ejes">Por ejes</button><button data-m="casos">Casos</button></div>
 <div class="sep"></div><span class="lab">Ruta</span><select id="pA"></select><span class="lab">→</span><select id="pB"></select><button class="btn" id="pGo">Trazar</button>
 <div class="sep"></div><button class="btn" id="bSrc">Fuentes</button><button class="btn" id="bHelp">?</button><button class="btn on" id="bRot" title="Rotación">⟳</button><button class="btn" id="bReset" title="Restablecer">⟲</button>
</div>
<div id="tip"></div>
<div id="modal"><div class="box" id="mbox"></div></div>
<template id="helpTpl"><div class="help"><div style="display:flex;justify-content:space-between"><h3>Cómo usar la red</h3><button class="x" id="mx">×</button></div>
 <h4>Navegar por niveles</h4><ul>
 <li>Los nodos con un <b>anillo pulsante</b> y "＋n" tienen contenido oculto. <b>Doble clic</b> para expandirlos, o usa <b>＋ Expandir</b> en el panel.</li>
 <li><b>◎ Entrar en esta red</b> aísla un autor, obra o concepto con todo su contenido y sus conexiones externas. La barra superior permite volver.</li>
 <li><b>Nivel de detalle</b>: 1 muestra autores y obras; 2 añade conceptos; 3 lo despliega todo.</li></ul>
 <h4>Aprender</h4><ul>
 <li><b>★ Guía del proyecto</b> recorre 10 fases de un proyecto real y dice qué recomienda cada autor en cada una.</li>
 <li>El panel de cada nodo trae: idea en una frase (paráfrasis), ideas clave, cómo aplicarlo, errores a evitar, casos y fuentes.</li>
 <li><b>Ruta</b> traza la conexión más corta entre dos ideas (p. ej. Brooks → Cohn).</li></ul>
 <h4>Leer los enlaces</h4><ul>
 <li>Línea continua = enlace documentado (DOC). Punteada = vínculo conceptual propuesto (CONC). Las partículas muestran influencias documentadas entre autores.</li></ul></div></template>
<script>

const tmp=new THREE.Vector3();
function simulate(){

 for(let i=0;i<N;i++){const a=V[i];for(let j=i+1;j<N;j++){const b=V[j];
  tmp.subVectors(a.p3,b.p3);let d2=tmp.lengthSq();if(d2>360000)continue;if(d2<1)d2=1;
  const w=(a.t==='elemento'||b.t==='elemento')?.45:1;const f=1500*w*alpha/d2;tmp.multiplyScalar(f/Math.sqrt(d2));a.v.add(tmp);b.v.sub(tmp)}}
 DRAW.forEach(d=>{const a=byId[d.a],b=byId[d.b];let L,k;
  if(d.k==='arbol'){L=LEN.arbol[b.t]||40;k=STR.arbol}else{L=LEN[d.k];k=STR[d.k]}
  if(ST.root){L*=d.k==='arbol'?1.9:1.3}
  if(ST.mode==='ejes'&&d.k==='eje'){L=60;k=.03}
  if(d.px){k*=.5}
  tmp.subVectors(b.p3,a.p3);const dd=tmp.length()||1;tmp.multiplyScalar((dd-L)*k*alpha/dd);a.v.add(tmp);b.v.sub(tmp)});

  if(n.shell){const d=n.p3.length()||1;n.v.addScaledVector(n.p3,(n.shell-d)/d*.02*alpha)}
  n.v.addScaledVector(n.p3,-.0012*alpha);n.v.multiplyScalar(.82);n.p3.add(n.v)});

}

  if(a==='guide'){ST.sel=null;refresh();renderGuide()}
  if(a==='exp'){toggleExp(n.id);renderDetail(n);setTimeout(()=>flyTo(n,ST.exp.has(n.id)?Math.min(140+descCount(n.id)*9,520):undefined),120)}
  if(a==='enter')enterRoot(n.id)});
}

/* ---------- guía ---------- */
function openGuide(i){
 if(ST.root)exitRoot(false);if(ST.mode!=='red')setMode('red',false);
 ST.guide=i;ST.sel=null;ST.path=null;ST.pathE.clear();
 const g=GUIDE[i];g.nodes.concat(g.rec.map(r=>r[0])).forEach(reveal);
 if(g.casos.length){ST.typeOn.caso=true;document.getElementById('t_caso').checked=true}
 refresh();kick(.5);renderGuide();document.getElementById('bGuide').classList.add('on');
 setTimeout(()=>flyToSet(g.nodes.concat(g.casos),620),450);
}
function closeGuide(){ST.guide=null;document.getElementById('bGuide').classList.remove('on');document.getElementById('detail').classList.remove('on');refresh();home()}
function renderGuide(){
 const i=ST.guide,g=GUIDE[i],D=document.getElementById('detail');
 let h=`<div class="ph"><span>Guía del proyecto · paso ${i+1} de ${GUIDE.length}</span><button class="x" data-ga="close">×</button></div><div class="steps">${GUIDE.map((s,j)=>`<button class="${j===i?'on':''}" data-gs="${j}" title="${esc(s.n)}">${j+1}</button>`).join('')}</div><div class="dt">`;
 h+=`<h2>${esc(g.n)}</h2><p class="obj">${esc(g.obj)}</p>`;
 h+=`<div class="sec"><h5>Preguntas clave</h5>${ul(g.q,'li-q')}</div>`;
 h+=`<div class="sec"><h5>Recomendaciones de los autores</h5>${g.rec.map(([id,t])=>{const n=byId[id];const a=n.own?AUT[n.own].n:rootOf(n).n;return `<div class="cn rec" data-go="${id}"><span class="dot" style="background:${n.color}"></span><div><b>${esc(a)} · ${esc(n.n)}</b><small>${esc(t)}</small></div></div>`}).join('')}</div>`;
 h+=`<div class="sec"><h5>Errores a evitar</h5>${ul(g.ev,'li-x')}</div>`;
 h+=`<div class="sec"><h5>Artefactos</h5><div class="chips">${g.art.map(a=>`<span class="chip static">▤ ${esc(a)}</span>`).join('')}</div></div>`;
 if(g.casos.length)h+=`<div class="sec"><h5>Casos para discutir</h5>${g.casos.map(c=>{const n=byId[c];return `<div class="cn" data-go="${c}"><span class="dot" style="background:${n.color}"></span><div><b>${esc(n.n)} · ${n.y}</b><small>${esc(n.d)}</small></div></div>`}).join('')}</div>`;
 h+=`<div class="gnav"><button class="act" data-ga="prev" ${i===0?'disabled':''}>← Anterior</button><button class="act pri" data-ga="next" ${i===GUIDE.length-1?'disabled':''}>Siguiente →</button></div></div>`;
 D.innerHTML=h;D.classList.add('on');D.scrollTop=0;
 D.querySelectorAll('[data-go]').forEach(el=>el.onclick=()=>select(el.dataset.go,true));
 D.querySelectorAll('[data-gs]').forEach(el=>el.onclick=()=>openGuide(+el.dataset.gs));
 D.querySelectorAll('[data-ga]').forEach(el=>el.onclick=()=>{const a=el.dataset.ga;if(a==='close')closeGuide();if(a==='prev')openGuide(i-1);if(a==='next')openGuide(i+1)});
}

/* ---------- ruta ---------- */
function shortest(a,b){/* Dijkstra: enlaces documentados pesan 1, conceptuales 1.6 */
 const dist={[a]:0},prev={[a]:null},done=new Set();
 while(true){let x=null,bd=Infinity;for(const k in dist)if(!done.has(k)&&dist[k]<bd){bd=dist[k];x=k}
  if(x===null||x===b)break;done.add(x);
  for(const e of ADJ[x]){if(e.k==='eje')continue;const y=e.s===x?e.t:e.s;if(done.has(y))continue;if(byId[y].t==='caso'&&y!==b)continue;
   const w=bd+(e.ev==='conc'?1.6:1);if(!(y in dist)||w<dist[y]){dist[y]=w;prev[y]={x,e}}}}
 if(!(b in prev))return null;const nodes=[],edges=[];let c=b;while(c!==null){nodes.unshift(c);const p=prev[c];if(!p)break;edges.unshift(p.e);c=p.x}return{nodes,edges}}
function tracePath(){const a=document.getElementById('pA').value,b=document.getElementById('pB').value;if(!a||!b||a===b)return;
 if(ST.root)exitRoot(false);if(ST.guide!==null){ST.guide=null;document.getElementById('bGuide').classList.remove('on')}
 const r=shortest(a,b),D=document.getElementById('detail');
 if(!r){D.innerHTML=`<div class="ph"><span>Ruta</span><button class="x" id="dx">×</button></div><div class="dt"><p>No hay ruta entre estos nodos.</p></div>`;D.classList.add('on');D.querySelector('#dx').onclick=clearSel;return}
 if(ST.mode==='infl')setMode('red',false);
 r.nodes.forEach(reveal);ST.sel=null;ST.path=r.nodes;ST.pathE=new Set(r.edges.map(e=>e.i));ST.pathDir={};r.edges.forEach((e,j)=>ST.pathDir[e.i]=e.s===r.nodes[j]);
 refresh();kick(.4);
 let h=`<div class="ph"><span>Ruta · ${r.edges.length} saltos</span><button class="x" id="dx">×</button></div><div class="dt"><h2 style="font-size:17px">${esc(byId[a].n)} → ${esc(byId[b].n)}</h2>`;
 r.nodes.forEach((id,j)=>{const n=byId[id];h+=`<div class="cn" data-go="${id}"><span class="dot" style="background:${n.color}"></span><div><b>${esc(n.n)}</b><small>${esc(typeName(n))}</small></div></div>`;
  if(j<r.edges.length){const e=r.edges[j];const ref=e.refs.find(x=>REF[x]&&REF[x].u);h+=`<div class="hop">${esc(e.k==='arbol'?(e.s===id?'contiene':'es parte de'):e.rel)} <span class="ev ${e.ev}">${e.ev==='doc'?'DOC':'CONC'}</span>${ref?` · <a href="${REF[ref].u}" target="_blank" rel="noopener">fuente</a>`:''}</div>`}});
 D.innerHTML=h+'</div>';D.classList.add('on');D.querySelector('#dx').onclick=clearSel;D.querySelectorAll('.cn[data-go]').forEach(el=>el.onclick=()=>select(el.dataset.go,true));
 setTimeout(()=>flyToSet(r.nodes,560),500);
}

/* =========================================================
   7. UI
   ========================================================= */
const TYPES=[['autor','Autores','●'],['precursor','Precursores / complementos','●'],['obra','Obras','◆'],['concepto','Conceptos','●'],['elemento','Elementos (detalle)','·'],['eje','Ejes (perfil)','◇'],['caso','Casos reales','■']];
function stats(){const c=t=>NODES.filter(n=>n.t===t).length;
 const S=[['Autores',c('autor'),'#E50914'],['Obras',c('obra')],['Conceptos',c('concepto')],['Elementos',c('elemento')],['Enlaces',ALL.filter(e=>e.k!=='eje').length],['Fuentes',Object.keys(REF).length],['Fases guía',GUIDE.length]];
 document.getElementById('stats').innerHTML=S.map(s=>`<div class="stat"><b style="color:${s[2]||'#0f172a'}">${s[1]}</b><span>${s[0]}</span></div>`).join('')}
function syncAut(){document.querySelectorAll('#lgAut input').forEach(i=>i.checked=ST.autOn[i.dataset.a])}
function legend(){
 const la=document.getElementById('lgAut');
 la.innerHTML=Object.keys(AUT).map(k=>`<label class="row"><input type="checkbox" data-a="${k}" checked><span class="dot" style="background:${AUT[k].color}"></span>${AUT[k].n}<em>${NODES.filter(n=>n.own===k&&n.t!=='autor').length}</em><button class="mini" data-enter="${k}" title="Entrar">◎</button></label>`).join('');
 la.querySelectorAll('input').forEach(i=>i.onchange=()=>{ST.autOn[i.dataset.a]=i.checked;refresh();kick(.3)});
 la.querySelectorAll('[data-enter]').forEach(b=>b.onclick=ev=>{ev.preventDefault();enterRoot(b.dataset.enter)});
 document.getElementById('lgType').innerHTML=TYPES.map(([t,n,s])=>`<label class="row"><input type="checkbox" id="t_${t}" ${ST.typeOn[t]?'checked':''}><span class="sh">${s}</span>${n}<em>${NODES.filter(x=>x.t===t).length}</em></label>`).join('');
 TYPES.forEach(([t])=>document.getElementById('t_'+t).onchange=ev=>{ST.typeOn[t]=ev.target.checked;refresh();kick(.3)});
 document.getElementById('nodelist').innerHTML=NODES.map(n=>`<option value="${esc(n.n)}">${esc(typeName(n))}</option>`).join('');
 const opts='<option value="">—</option>'+[...NODES].filter(n=>n.t!=='eje').sort((a,b)=>a.n.localeCompare(b.n)).map(n=>`<option value="${n.id}">${esc(n.n)}</option>`).join('');
 pA.innerHTML=opts;pB.innerHTML=opts;pA.value='brooks';pB.value='cohn';
}
const pA=document.getElementById('pA'),pB=document.getElementById('pB');
document.getElementById('search').addEventListener('change',ev=>{const v=ev.target.value.trim().toLowerCase();if(!v)return;const n=NODES.find(x=>x.n.toLowerCase()===v)||NODES.find(x=>x.n.toLowerCase().includes(v));if(n){select(n.id,true);ev.target.value=''}});
document.getElementById('fDoc').onchange=e=>{ST.doc=e.target.checked;refresh()};
document.getElementById('fConc').onchange=e=>{ST.conc=e.target.checked;refresh()};
document.getElementById('fEje').onchange=e=>{ST.eje=e.target.checked;refresh();kick(.4)};
document.getElementById('fLbl').onchange=e=>{ST.allLbl=e.target.checked;restyle()};
document.querySelectorAll('#lvl button').forEach(b=>b.onclick=()=>{if(ST.root)exitRoot(false);setLevel(+b.dataset.l)});
function setMode(m,fly=true){ST.mode=m;document.querySelectorAll('#modes button').forEach(b=>b.classList.toggle('on',b.dataset.m===m));ST.path=null;ST.pathE.clear();if(ST.root){ST.root=null;ST.scope=null;ST.ext.clear();crumbs()}applyMode();if(fly){ST.sel=null;if(ST.guide===null)document.getElementById('detail').classList.remove('on');home()}}
document.querySelectorAll('#modes button').forEach(b=>b.onclick=()=>setMode(b.dataset.m));
document.getElementById('pGo').onclick=tracePath;
document.getElementById('bGuide').onclick=()=>{if(ST.guide!==null)closeGuide();else openGuide(0)};
const rotBtn=on=>document.getElementById('bRot').classList.toggle('on',on);
document.getElementById('bRot').onclick=()=>{controls.autoRotate=!controls.autoRotate;rotBtn(controls.autoRotate)};
document.getElementById('bReset').onclick=()=>{if(ST.root)exitRoot(false);ST.guide=null;document.getElementById('bGuide').classList.remove('on');clearSel();document.getElementById('detail').classList.remove('on');home()};
document.getElementById('legendToggle').onclick=()=>document.getElementById('legend').classList.toggle('on');
document.getElementById('bSrc').onclick=()=>{
 const used={};ALL.forEach(e=>e.refs.forEach(r=>used[r]=(used[r]||0)+1));NODES.forEach(n=>{if(n.ref)used[n.ref]=(used[n.ref]||0)+1});
 const keys=Object.keys(REF).sort((a,b)=>(used[b]||0)-(used[a]||0));
 document.getElementById('mbox').innerHTML=`<div style="display:flex;justify-content:space-between;align-items:start"><div><h3>Fuentes y referencias · ${keys.length}</h3><p class="mnote">Cada enlace transversal está marcado como <span class="ev doc">DOC</span> (respaldado por una fuente que lo afirma) o <span class="ev conc">CONC</span> (vínculo conceptual propuesto con fines pedagógicos). Las frases de los autores son paráfrasis, no citas textuales. 📖 = referencia bibliográfica impresa.</p></div><button class="x" id="mx">×</button></div>`+
 keys.map(k=>`<div class="ri"><b>${used[k]||0}</b><div>${REF[k].u?`<a href="${REF[k].u}" target="_blank" rel="noopener">${esc(REF[k].t)} ↗</a>`:'📖 '+esc(REF[k].t)}<small>${REF[k].u?esc(REF[k].u):'Libro impreso'}</small></div></div>`).join('');
 document.getElementById('modal').classList.add('on');document.getElementById('mx').onclick=()=>document.getElementById('modal').classList.remove('on')};
document.getElementById('modal').onclick=e=>{if(e.target.id==='modal')e.target.classList.remove('on')};
document.getElementById('bHelp').onclick=()=>{document.getElementById('mbox').innerHTML=document.getElementById('helpTpl').innerHTML;document.getElementById('modal').classList.add('on');document.getElementById('mx').onclick=()=>document.getElementById('modal').classList.remove('on')};
addEventListener('keydown',e=>{if(e.key==='Escape'){document.getElementById('modal').classList.remove('on');if(ST.root)exitRoot();else clearSel()}});
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);lr.setSize(innerWidth,innerHeight)});

stats();legend();applyMode(false);setLevel(2);
for(let i=0;i<300;i++)simulate();alpha=.3;
frame();
window.__net={ST,NODES,ALL,enterRoot,openGuide,toggleExp,select};
